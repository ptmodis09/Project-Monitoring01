name: Catat perubahan spreadsheet

on:
  schedule:
    - cron: "*/5 * * * *"   # tiap 5 menit (GitHub kadang telat beberapa menit)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/sheet_log.py"
      - ".github/workflows/sheet-log.yml"

permissions:
  contents: write

concurrency:
  group: sheet-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek spreadsheet
        run: python scripts/sheet_log.py
      - name: Simpan log ke repo
        run: |
          git config user.name "sheet-log-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada yang perlu disimpan."
            exit 0
          fi
          git commit -m "Log perubahan spreadsheet $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
